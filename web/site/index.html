<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Nook: Home & Life Hub</title>
<meta name="description" content="A cozy, customizable organizer for your home and life.">
<style>
  :root { --bg:#fbf7f2; --card:#ffffff; --text:#2a2420; --muted:#726862; --accent:#8a5a3b; --border:#ece4dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2a2330; --card:#342b39; --text:#f4ece6; --muted:#b9adb4; --accent:#f0b98d; --border:#463b4b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
  main { max-width:680px; margin:0 auto; padding:32px 16px 64px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px 20px; }
  h1 { font-size:28px; line-height:1.2; margin:0 0 4px; letter-spacing:-0.3px; }
  h2 { font-size:19px; margin:28px 0 8px; color:var(--accent); }
  p, li { font-size:16px; }
  ul { padding-left:22px; }
  .muted { color:var(--muted); font-size:14px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
<div class="card">
<h1>Nook</h1>
<p class="muted">Home &amp; Life Hub</p>
<p>A cozy, customizable organizer. Decorate your Hearth, then add the little apps you need: wish lists and gifts, Gatherings, pet care, a fridge door, and more.</p>
<p>Questions or feedback? <a href="mailto:support@mynookapp.app">support@mynookapp.app</a></p>
<p><a href="/privacy/">Privacy Policy</a></p>
</div>
</main>
</body>
</html>
