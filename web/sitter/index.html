<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sitter Sheet Nook (SIT-001, SIT-005, SIT-007): the page a sitter opens from
     a link, no app or account needed. The secret is after "#", which the
     browser never sends to this web host. Never indexed, never passed on. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src __SUPABASE_URL__; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Sitter Sheet</title>
<style>
  :root {
    --bg: #faf5ec; --card: #ffffff; --text: #3b2f25; --muted: #7d6e60; --accent: #7a4f8f;
    --accent-soft: #e8dcef; --border: #eadfce; --alert: #b3412e; --alert-soft: #fbe6e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a16; --card: #2a241f; --text: #f1e8dc; --muted: #b3a593; --accent: #c9a6dc;
      --accent-soft: #3b2f45; --border: #3a322b; --alert: #f08a75; --alert-soft: #3d2420;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 20px; }
  .eyebrow { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { font-size: 28px; line-height: 1.2; margin: 4px 0; }
  h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 28px 0 10px; }
  .muted { color: var(--muted); font-size: 15px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; overflow-wrap: anywhere;
  }
  .card p { margin: 0; white-space: pre-wrap; }
  .name { font-weight: 700; font-size: 18px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions a {
    flex: 1; text-align: center; text-decoration: none; font-weight: 700;
    padding: 11px 0; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
  }
  .actions a.call { background: var(--accent); color: var(--card); }
  .alert { color: var(--alert); font-weight: 700; }
  .tag { display: inline-block; background: var(--alert-soft); color: var(--alert); border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 600; margin: 4px 4px 0 0; }
  .row { margin-top: 6px; }
  .label { color: var(--muted); font-size: 14px; }
  .center { text-align: center; padding-top: 18vh; }
  .center .icon { font-size: 44px; }
  footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main id="app">
  <div class="center"><p class="muted">Opening the sheet…</p></div>
</main>
<script>
(function () {
  var SUPABASE_URL = "__SUPABASE_URL__";
  var ANON_KEY = "__SUPABASE_ANON_KEY__";
  var app = document.getElementById("app");
  var token = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();

  // Everything is built with textContent, never HTML strings, so nothing
  // typed on the sheet can run as code on the sitter's phone.
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function dial(number) { return String(number).replace(/[^\d+]/g, ""); }

  function nothing(title, body) {
    app.textContent = "";
    add(app, add(el("div", "center"), el("div", "icon", "🔒"), el("h1", null, title), el("p", "muted", body)));
  }

  function phoneCard(name, number, note) {
    var card = add(el("div", "card"), el("div", "name", name));
    if (note) add(card, el("div", "muted", note));
    add(card, el("div", "muted", number));
    var actions = el("div", "actions");
    var call = el("a", "call", "Call");
    call.href = "tel:" + dial(number);
    var text = el("a", null, "Text");
    text.href = "sms:" + dial(number);
    add(card, add(actions, call, text));
    return card;
  }

  function textCard(body) { return add(el("div", "card"), el("p", null, body)); }

  function section(title) { return el("h2", null, title); }

  var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function day(s) {
    var p = s.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return days[d.getDay()] + ", " + months[p[1] - 1] + " " + p[2];
  }
  function time(t) {
    if (!t) return "";
    var p = t.split(":").map(Number);
    return new Date(2000, 0, 1, p[0], p[1]).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function render(s) {
    app.textContent = "";
    document.title = s.label + " · Sitter Sheet";
    add(app, add(el("header"),
      el("div", "eyebrow", "Sitter Sheet"),
      el("h1", null, s.label),
      el("div", "muted", s.starts_on === s.ends_on ? day(s.starts_on) : day(s.starts_on) + " – " + day(s.ends_on))));

    if (s.contacts && s.contacts.length) {
      add(app, section("Emergency numbers"));
      s.contacts.forEach(function (c) { add(app, phoneCard(c.name, c.phone, c.note)); });
    }
    if (s.address) add(app, section("Address"), textCard(s.address));
    if (s.doctor_name || s.doctor_phone) {
      add(app, section("Doctor"));
      add(app, s.doctor_phone ? phoneCard(s.doctor_name || "Doctor", s.doctor_phone) : textCard(s.doctor_name));
    }

    if (s.kids && s.kids.length) {
      add(app, section("Kids"));
      s.kids.forEach(function (k) {
        var card = add(el("div", "card"), el("div", "name", k.name));
        if (k.allergies.length) {
          var row = add(el("div", "row"), el("div", "alert", "Allergies"));
          k.allergies.forEach(function (a) { add(row, el("span", "tag", a)); });
          add(card, row);
        } else {
          add(card, el("div", "muted", "No allergies listed"));
        }
        if (k.diets.length) add(card, add(el("div", "row"), el("span", "label", "Diet: "), el("span", null, k.diets.join(", "))));
        add(app, card);
      });
    }

    if (s.bedtime) add(app, section("Bedtime"), textCard(s.bedtime));
    if (s.food) add(app, section("Food"), textCard(s.food));
    if (s.rules) add(app, section("House rules"), textCard(s.rules));

    if (s.pets && s.pets.length) {
      add(app, section("Pets"));
      s.pets.forEach(function (p) {
        var card = add(el("div", "card"), el("div", "name", p.name));
        function line(label, value) { if (value) add(card, add(el("div", "row"), el("span", "label", label + ": "), el("span", null, value))); }
        line("Food", p.food);
        line("Meals", p.meals.map(function (m) { return m.time ? m.label + " (" + time(m.time) + ")" : m.label; }).join(", "));
        line("Medications", p.medications.map(function (m) { return m.notes ? m.title + " — " + m.notes : m.title; }).join("; "));
        if (p.notes) add(card, add(el("div", "row"), el("p", null, p.notes)));
        add(app, card);
        if (p.vet_phone) add(app, phoneCard(p.vet_name || p.name + "'s vet", p.vet_phone, p.name + "'s vet"));
      });
    }

    if (s.notes) add(app, section("Anything else"), textCard(s.notes));

    add(app, el("footer", null, "This page stops working after " + day(s.ends_on) + ". Made with Nook."));
  }

  if (!token || token.length < 30) {
    return nothing("Nothing to see here", "This link is missing its secret part. Ask the family to send it again.");
  }

  fetch(SUPABASE_URL + "/rest/v1/rpc/sitter_sheet_for_link", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY },
    body: JSON.stringify({ link: token }),
    referrerPolicy: "no-referrer",
    cache: "no-store"
  })
    .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function (sheet) {
      if (!sheet) return nothing("This link has ended", "It ran out or the family switched it off. Ask them for a new one.");
      render(sheet);
    })
    .catch(function () {
      nothing("Couldn't open the sheet", "Check your internet connection and refresh the page.");
    });
})();
</script>
</body>
</html>
